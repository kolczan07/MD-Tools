name: Build debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0)
          gradle assembleDebug --no-daemon \
            -PversionName="${TAG#v}-debug" \
            -PversionCode=$(( $(date +%s) / 60 ))
      - uses: actions/upload-artifact@v4
        with:
          name: md-tools-debug-apk
          path: app/build/outputs/apk/debug/*.apk