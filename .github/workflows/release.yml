name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon
          -PversionName=${GITHUB_REF_NAME#v}
          -PversionCode=${{ github.run_number }}
      - name: Name the APK
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Znaleziony APK: $APK"
          cp "$APK" "MD-Tools-${GITHUB_REF_NAME}.apk"
          ls -la MD-Tools-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: MD-Tools-*.apk
          generate_release_notes: true
