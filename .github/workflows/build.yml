name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Wymagane sekrety (Settings -> Secrets and variables -> Actions).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Brak sekretu $v (Settings -> Secrets and variables -> Actions)"
              exit 1
            fi
          done

      - name: Restore keystore from secret
        run: echo "$KEYSTORE_B64" | base64 -d > release.jks

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Tools-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts) || VER=""
          echo "VER=[$VER]"
          if [ -z "$VER" ]; then
            echo "::error::Nie udało się odczytać versionName z app/build.gradle.kts"
            exit 1
          fi
          TAG="v$VER"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "TAG=[$TAG] APK=[$APK]"
          
          # Spróbuj utworzyć Release (jeśli istnieje, błąd jest ignorowany)
          gh release create "$TAG" "$APK" --title "MD-Tools $VER" --notes "Wersja $VER" || true
          
          # Upewnij się, że APK jest wgrany (nadpisz, jeśli już był)
          gh release upload "$TAG" "$APK" --clobber
